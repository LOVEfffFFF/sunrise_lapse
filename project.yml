name: SunriseLapse
options:
  bundleIdPrefix: com.sunriselapse
  createIntermediateGroups: true
targets:
  SunriseLapse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SunriseLapse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunriselapse.SunriseLapse
        INFOPLIST_FILE: SunriseLapse/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
